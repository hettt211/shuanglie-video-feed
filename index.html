<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>双列种草视频卡</title>
<style>
  :root {
    --bg: #ffffff;
    --card-bg: #f7f8fa;
    --text: #1a1c1f;
    --text-dim: #9aa0a8;
    --accent: #ff4d4f;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }

  /* 外壳：居中模拟手机双列流 */
  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* 顶栏 */
  .header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 14px 10px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .header h1 { font-size: 17px; font-weight: 600; flex: 1; }
  .header .count { font-size: 12px; color: var(--text-dim); }

  /* 双列网格 */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 12px 14px 24px;
  }

  /* 卡片 */
  .card {
    position: relative;
    border-radius: var(--radius);
    background: var(--card-bg);
    overflow: hidden;
    cursor: pointer;
    transition: transform .12s ease;
  }
  .card:active { transform: scale(.97); }
  .card .cover {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    display: block;
    background: #e9eaec;
  }
  .card .title {
    padding: 9px 10px 11px;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.35;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 38px;
  }

  /* 播放页（全屏浮层） */
  .player {
    position: fixed; inset: 0; z-index: 100;
    background: #000;
    display: none;
    flex-direction: column;
  }
  .player.open { display: flex; }
  .player .topbar {
    display: flex; align-items: center; gap: 6px;
    padding: 14px 10px;
    flex-shrink: 0;
  }
  .player .back {
    background: rgba(255,255,255,0.10);
    border: none; color: #fff;
    width: 36px; height: 36px; border-radius: 50%;
    font-size: 20px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .player .back:active { background: rgba(255,255,255,0.2); }
  .player .p-title {
    font-size: 15px; font-weight: 600; color: #fff;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .player .stage {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
  }
  .player video {
    width: 100%; max-height: 100%;
    background: #000; outline: none;
  }
  .player .meta {
    flex-shrink: 0;
    padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
    text-align: center;
    font-size: 15px;
    color: #e6e6e6;
    line-height: 1.5;
  }
  .player .meta .sep { color: var(--text-dim); padding: 0 6px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>双列种草视频</h1>
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- 播放页浮层 -->
<div class="player" id="player">
  <div class="topbar">
    <button class="back" id="backBtn" aria-label="返回">‹</button>
    <div class="p-title" id="pTitle"></div>
  </div>
  <div class="stage">
    <video id="video" controls playsinline preload="metadata"></video>
  </div>
  <div class="meta" id="meta"></div>
</div>

const grid = document.getElementById('grid');
const count = document.getElementById('count');
count.textContent = VIDEOS.length + ' 条';

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildGrid() {
  const frag = document.createDocumentFragment();
  VIDEOS.forEach((v, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<img class="cover" loading="lazy" src="' + esc(v.cover) + '" alt="">' +
      '<div class="title">' + esc(v.title) + '</div>';
    card.addEventListener('click', () => openPlayer(i));
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

const player = document.getElementById('player');
const video = document.getElementById('video');
const pTitle = document.getElementById('pTitle');
const meta = document.getElementById('meta');
const backBtn = document.getElementById('backBtn');

function openPlayer(i) {
  const v = VIDEOS[i];
  pTitle.textContent = v.title;
  // 播放页下方：视频类型｜视频文案
  meta.innerHTML = '<span>' + esc(v.type) + '</span><span class="sep">｜</span><span>' + esc(v.copy) + '</span>';
  video.src = v.video;
  player.classList.add('open');
  document.body.style.overflow = 'hidden';
  video.play().catch(() => {});
}

function closePlayer() {
  player.classList.remove('open');
  document.body.style.overflow = '';
  video.pause();
  video.removeAttribute('src');
  video.load();
}

backBtn.addEventListener('click', closePlayer);
// 安卓返回键 / ESC
window.addEventListener('popstate', closePlayer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(); });

buildGrid();
</script>
